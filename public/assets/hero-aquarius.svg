<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620">
<defs>
<linearGradient id="sky" x2="1" y2="1"><stop stop-color="#f8e7ea"/><stop offset=".45" stop-color="#bda4dc"/><stop offset="1" stop-color="#f2c98e"/></linearGradient>
<linearGradient id="gold"><stop stop-color="#f1ca83"/><stop offset="1" stop-color="#8a5428"/></linearGradient>
<linearGradient id="purple"><stop stop-color="#9c5de0"/><stop offset="1" stop-color="#4d287e"/></linearGradient>
<linearGradient id="water" x2="0" y2="1"><stop stop-color="#8deaff"/><stop offset=".45" stop-color="#4c7eff"/><stop offset="1" stop-color="#281c78"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="620" fill="url(#sky)"/>
<circle cx="1050" cy="180" r="300" fill="url(#glow)" opacity=".7"/>
<g fill="#fff8e8" opacity=".9"><circle cx="110" cy="90" r="5"/><circle cx="260" cy="145" r="7"/><circle cx="420" cy="70" r="4"/><circle cx="690" cy="100" r="6"/><circle cx="940" cy="55" r="5"/><circle cx="1460" cy="95" r="7"/></g>

<!-- flowing cosmic water -->
