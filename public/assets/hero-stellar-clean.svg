<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#17132e"/>
    <stop offset=".28" stop-color="#3d245f"/>
    <stop offset=".55" stop-color="#8b4f86"/>
    <stop offset=".78" stop-color="#d49b83"/>
    <stop offset="1" stop-color="#f0c99e"/>
  </linearGradient>
  <radialGradient id="neb1"><stop offset="0" stop-color="#e6a5ca" stop-opacity=".72"/><stop offset="1" stop-color="#8c4f91" stop-opacity="0"/></radialGradient>
  <radialGradient id="neb2"><stop offset="0" stop-color="#f6d49c" stop-opacity=".72"/><stop offset="1" stop-color="#d17f91" stop-opacity="0"/></radialGradient>
  <radialGradient id="planet"><stop offset="0" stop-color="#f2d7bd"/><stop offset=".55" stop-color="#b27a75"/><stop offset="1" stop-color="#3c284e"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1200" height="600" fill="url(#sky)"/>
<ellipse cx="270" cy="165" rx="320" ry="210" fill="url(#neb1)" filter="url(#blur)"/>
<ellipse cx="900" cy="220" rx="330" ry="220" fill="url(#neb2)" filter="url(#blur)"/>
<ellipse cx="620" cy="500" rx="480" ry="180" fill="#f3c99e" opacity=".18" filter="url(#blur)"/>

<!-- stars -->
<g fill="#fff">
 <circle cx="55" cy="74" r="2"/><circle cx="108" cy="185" r="1.5"/><circle cx="155" cy="48" r="1.2"/>
 <circle cx="225" cy="108" r="2.2"/><circle cx="312" cy="54" r="1.3"/><circle cx="374" cy="150" r="1.8"/>
 <circle cx="438" cy="72" r="1.2"/><circle cx="510" cy="128" r="2"/><circle cx="572" cy="43" r="1.4"/>
 <circle cx="650" cy="105" r="1.8"/><circle cx="714" cy="58" r="1.2"/><circle cx="785" cy="138" r="2.2"/>
 <circle cx="864" cy="72" r="1.4"/><circle cx="930" cy="118" r="1.8"/><circle cx="1008" cy="55" r="1.3"/>
 <circle cx="1080" cy="150" r="2"/><circle cx="1150" cy="82" r="1.5"/><circle cx="72" cy="318" r="1.3"/>
 <circle cx="140" cy="405" r="2"/><circle cx="198" cy="285" r="1.4"/><circle cx="286" cy="350" r="1.8"/>
 <circle cx="370" cy="280" r="1.2"/><circle cx="455" cy="365" r="2"/><circle cx="535" cy="300" r="1.4"/>
 <circle cx="690" cy="330" r="1.8"/><circle cx="755" cy="270" r="1.2"/><circle cx="835" cy="385" r="2"/>
 <circle cx="930" cy="305" r="1.5"/><circle cx="1030" cy="360" r="1.8"/><circle cx="1115" cy="285" r="1.3"/>
</g>
<g fill="#fff" opacity=".75">
 <path d="M175 235l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
 <path d="M1000 210l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
 <path d="M600 170l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
</g>

<!-- zodiac wheel -->
<g transform="translate(620 275)" fill="none" stroke="#e8c27e" stroke-opacity=".62">
 <circle r="154" stroke-width="2"/>
 <circle r="128" stroke-width="1.2"/>
 <circle r="101" stroke-width="1"/>
 <g stroke-width="1">
  <path d="M0-154V-101M77-134L50-88M134-77L88-50M154 0H101M134 77L88 50M77 134L50 88M0 154V101M-77 134L-50 88M-134 77L-88 50M-154 0H-101M-134-77L-88-50M-77-134L-50-88"/>
 </g>
</g>
<g transform="translate(620 275)" fill="#f4d38f" font-family="Georgia,serif" font-size="25" text-anchor="middle" dominant-baseline="middle" opacity=".82">
 <text y="-133">♈</text><text x="67" y="-115">♉</text><text x="116" y="-67">♊</text><text x="133">♋</text>
 <text x="116" y="67">♌</text><text x="67" y="115">♍</text><text y="133">♎</text><text x="-67" y="115">♏</text>
 <text x="-116" y="67">♐</text><text x="-133">♑</text><text x="-116" y="-67">♒</text><text x="-67" y="-115">♓</text>
</g>

<!-- distant planet -->
<circle cx="1035" cy="110" r="47" fill="url(#planet)" opacity=".9"/>
<ellipse cx="1035" cy="110" rx="75" ry="15" fill="none" stroke="#e7c69f" stroke-opacity=".55" stroke-width="6" transform="rotate(-18 1035 110)"/>
<circle cx="1085" cy="470" r="125" fill="url(#planet)" opacity=".75"/>
<ellipse cx="1085" cy="470" rx="175" ry="30" fill="none" stroke="#e2b98d" stroke-opacity=".28" stroke-width="12" transform="rotate(-15 1085 470)"/>

<!-- soft cloud silhouettes -->
<g fill="#f4d7d4" opacity=".18" filter="url(#blur)">
 <ellipse cx="180" cy="500" rx="250" ry="75"/>
 <ellipse cx="760" cy="520" rx="300" ry="70"/>
 <ellipse cx="1050" cy="330" rx="210" ry="55"/>
</g>
<rect width="1200" height="600" fill="url(#sky)" opacity=".06"/>
</svg>