name: Install hero PNG
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-hero.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download hero
        run: curl -L --fail -o public/assets/hero-cosmic.png "https://d2ol7oe51mr4n9.cloudfront.net/user_3IrCswCI2cljMhgXUxCCGJSFFOh/895c2e90-b467-4ac0-9f34-36213c20227f.png"
      - name: Commit hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/hero-cosmic.png
          git diff --cached --quiet || git commit -m "V1.4: install master hero PNG"
          git push
