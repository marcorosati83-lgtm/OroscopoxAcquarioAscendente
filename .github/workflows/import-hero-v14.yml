name: Install V1.4 hero PNG
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-hero-v14.yml"
permissions:
  contents: write
jobs:
  install:
    if: github.event.head_commit.message == 'V1.4: trigger hero PNG import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download hero PNG
        run: |
          curl -L --fail --retry 3 -o public/assets/hero-cosmic.png "https://d2ol7oe51mr4n9.cloudfront.net/user_3IrCswCI2cljMhgXUxCCGJSFFOh/bb586008-c108-4fb0-a6ef-02add581b4ab.png"
      - name: Replace SVG and commit PNG
        run: |
          rm -f public/assets/hero-cosmic.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/hero-cosmic.png public/assets/hero-cosmic.svg
          git commit -m "V1.4: install high resolution hero PNG"
          git push
