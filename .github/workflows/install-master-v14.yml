name: Install master V1.4 PNG
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-master-v14.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download master card PNG
        run: curl -L --fail -o public/assets/master-v14.png "https://d2ol7oe51mr4n9.cloudfront.net/user_3IrCswCI2cljMhgXUxCCGJSFFOh/ce5861fa-df89-4c2f-9130-384d1d1ea574.png"
      - name: Remove legacy hero assets
        run: rm -f public/assets/hero-cosmic.svg public/assets/hero-cosmic.png public/assets/hero-aquarius.svg public/assets/kairo-panda.svg
      - name: Commit master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets
          git diff --cached --quiet || git commit -m "V1.4: add exact master card PNG"
          git push
